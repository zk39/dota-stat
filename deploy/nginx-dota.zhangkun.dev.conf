# 参考配置,不会被自动应用。
# 在服务器上手动放到 /etc/nginx/sites-available/dota.zhangkun.dev,
# 再 ln -s 到 sites-enabled,然后跑 certbot --nginx -d dota.zhangkun.dev
# certbot 会自动把这个文件改成带 443/证书的版本,这里先给最基础的 80 端口反代。
#
# 限速放在 nginx 这层是第一道防线:请求在真正打到 Python 进程 / 消耗 Steam-OpenDota 配额之前
# 就被挡掉,比 server.py 里那层限速(第二道保险)更省资源。下面这两个 zone 指令必须在
# http{} 上下文里,标准 Debian/Ubuntu nginx.conf 通过 include sites-enabled/*; 把本文件整个
# include 进 http{},所以直接写在 server{} 外层就行;如果你的 nginx.conf 不是这么 include 的,
# 把这两行挪到 /etc/nginx/conf.d/ 下的独立文件里。
limit_req_zone  $binary_remote_addr zone=dota_general:10m rate=5r/s;   # 全站:每 IP 平均 5 req/s
limit_req_zone  $binary_remote_addr zone=dota_api:10m     rate=2r/s;   # /api/*:更严,查询接口才是真花钱的地方
limit_conn_zone $binary_remote_addr zone=dota_conn:10m;                # 每 IP 同时连接数
limit_req_status 429;
limit_conn_status 429;

# ---- Cloudflare 真实 IP 还原(必须,否则上面的 limit_req 和后端限速都按 CF 节点 IP 计数、失效)----
# CF 段会变,建议定期更新:curl -s https://www.cloudflare.com/ips-v4 / ips-v6
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;   # 用 CF 设的真实客户端 IP(客户端伪造不了)

server {
    listen 80;
    listen [::]:80;
    server_name dota.zhangkun.dev;

    # /api/* 单独收紧:burst 允许短促点几次搜索/翻页,超了排队,再超直接拒绝
    location /api/ {
        limit_req  zone=dota_api burst=15 delay=5;
        limit_conn dota_conn 8;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        limit_req  zone=dota_general burst=30 nodelay;
        limit_conn dota_conn 15;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
