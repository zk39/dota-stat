# 参考配置,不会被自动应用。
# 在服务器上手动放到 /etc/nginx/sites-available/dota.zhangkun.dev,
# 再 ln -s 到 sites-enabled,然后跑 certbot --nginx -d dota.zhangkun.dev
# certbot 会自动把这个文件改成带 443/证书的版本,这里先给最基础的 80 端口反代。

server {
    listen 80;
    listen [::]:80;
    server_name dota.zhangkun.dev;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
