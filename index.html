<!doctype html>
<html lang="zh" class="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dota 战绩查询</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config = { darkMode: 'class' };</script>
<style>
  :root{ --bg:#f8fafc; --surface:#ffffff; --surface2:#eef2f7; --border:#e2e8f0; --text:#0f172a; --muted:#475569; --muted2:#94a3b8; --hover:#f1f5f9; --accent:#6366f1; }
  .dark{ --bg:#0a0a0b; --surface:#161618; --surface2:#212124; --border:#27272a; --text:#f4f4f5; --muted:#a1a1aa; --muted2:#71717a; --hover:#ffffff12; --accent:#818cf8; }
  html,body{ background:var(--bg); color:var(--text); }
  .card{ background:var(--surface); border:1px solid var(--border); border-radius:.85rem; }
  .muted{ color:var(--muted); } .muted2{ color:var(--muted2); }
  .thc{ color:var(--muted2); }
  .rowh{ border-top:1px solid var(--border); } .rowh:hover{ background:var(--hover); }
  .chip{ border:1px solid var(--border); color:var(--text); background:transparent; }
  .chip:hover{ background:var(--hover); }
  .chip-on{ background:var(--text); color:var(--bg); border-color:var(--text); }
  .inp{ background:var(--surface); border:1px solid var(--border); color:var(--text); }
  .inp::placeholder{ color:var(--muted2); }
  .sel{ background:var(--surface); border:1px solid var(--border); color:var(--text); }
  .link{ color:var(--accent); } .link:hover{ text-decoration:underline; }
  .hdr{ background:var(--bg); border-bottom:1px solid var(--border); }
  .fade{ animation:fade .18s ease-out; }
  @keyframes fade{ from{ opacity:0; transform:translateY(4px);} to{ opacity:1; transform:none; } }
  .sk{ background:linear-gradient(90deg,var(--surface) 25%,var(--surface2) 37%,var(--surface) 63%); background-size:400% 100%; animation:sk 1.2s ease-in-out infinite; border-radius:.4rem; }
  @keyframes sk{ 0%{background-position:100% 0} 100%{background-position:-100% 0} }
  #bar{ position:fixed; top:0; left:0; height:2px; width:0; background:var(--accent); opacity:0; z-index:60; transition:width .25s ease, opacity .35s ease; }
</style>
</head>
<body class="antialiased">
<div id="bar"></div>

<header class="hdr sticky top-0 z-40">
  <div class="mx-auto max-w-[1400px] px-3 py-3 sm:px-6 sm:py-4 lg:px-8">
    <div class="flex flex-col gap-2 sm:flex-row sm:items-center sm:gap-4">
      <div class="flex items-center justify-between gap-3 sm:contents">
        <a href="#/" class="shrink-0 text-lg font-bold tracking-tight sm:text-2xl" style="color:var(--accent)">DOTA<span style="color:var(--text)">战绩</span></a>
        <button onclick="toggleTheme()" id="themeBtn" class="chip shrink-0 rounded-lg px-3 py-2 text-xs sm:order-3 sm:px-4 sm:py-3 sm:text-sm"></button>
      </div>
      <form onsubmit="onSearch(event)" class="flex flex-1 gap-2">
        <input id="q" placeholder="玩家ID / SteamID64 / 对局ID / 游戏名"
          class="inp w-full min-w-0 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500/40 sm:px-4 sm:py-3 sm:text-base">
        <button class="shrink-0 rounded-lg px-4 py-2.5 text-sm font-medium text-white sm:px-5 sm:py-3 sm:text-base" style="background:var(--accent)">搜索</button>
      </form>
    </div>
    <div id="status" class="mt-1 h-4 text-xs muted2"></div>
  </div>
</header>

<main id="app" class="mx-auto max-w-[1400px] px-3 py-4 sm:px-6 sm:py-8 lg:px-8"></main>

<footer class="mx-auto max-w-[1400px] px-3 py-8 text-center text-xs muted2 sm:px-6 sm:py-10 sm:text-sm lg:px-8">
  <a href="https://zhangkun.dev" target="_blank" class="link font-medium">zhangkun.dev</a>
  <span class="mx-2">·</span>数据来源 OpenDota / Valve<span class="mx-2">·</span>段位/MMR 为粗略估算
</footer>

<script>
/* ============ 主题 ============ */
function updateThemeBtn(){ document.getElementById('themeBtn').textContent = document.documentElement.classList.contains('dark') ? '浅色' : '深色'; }
function applyTheme(t){ document.documentElement.classList.toggle('dark', t==='dark'); try{ localStorage.setItem('theme',t); }catch(e){} updateThemeBtn(); }
function toggleTheme(){ applyTheme(document.documentElement.classList.contains('dark') ? 'light' : 'dark'); }
(function(){ var t='dark'; try{ t=localStorage.getItem('theme')||'dark'; }catch(e){} applyTheme(t); })();

/* ============ 工具 ============ */
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
var app = document.getElementById('app');
var statusEl = document.getElementById('status');
function setStatus(t){ statusEl.textContent = t || ''; }

/* 顶部进度条 */
var _loads=0, _bar=document.getElementById('bar');
function startLoad(){ _loads++; _bar.style.opacity='1'; _bar.style.width='75%'; }
function stopLoad(){ _loads=Math.max(0,_loads-1); if(_loads===0){ _bar.style.width='100%'; setTimeout(function(){ _bar.style.opacity='0'; _bar.style.width='0'; },250);} }

/* 缓存 + 请求(命中缓存即时返回;quiet 不触发进度条,用于后台补数据) */
var CACHE = new Map();
var INFLIGHT = new Map();   // 进行中的请求:同一 URL 并发只发一次(客户端 single-flight,防狂点重复请求)
async function _get(url, quiet){
  if(CACHE.has(url)) return CACHE.get(url);
  if(INFLIGHT.has(url)) return INFLIGHT.get(url);   // 已在请求中 → 复用同一个 Promise,不再发新请求
  if(!quiet) startLoad();
  var p = (async function(){
    try{ var r=await fetch(url); var d=await r.json(); if(d && !d.error) CACHE.set(url,d); return d; }
    finally{ INFLIGHT.delete(url); if(!quiet) stopLoad(); }
  })();
  INFLIGHT.set(url, p);
  return p;
}
function fetchJSON(u){ return _get(u,false); }
function fetchQuiet(u){ return _get(u,true); }

/* ============ 收藏(localStorage) ============ */
var FAV_KEY='dota_fav_players';
function getFavorites(){ try{ var a=JSON.parse(localStorage.getItem(FAV_KEY)||'[]'); return Array.isArray(a)?a:[]; }catch(e){ return []; } }
function saveFavorites(arr){ try{ localStorage.setItem(FAV_KEY, JSON.stringify(arr)); }catch(e){} }
function isFavorite(accId){ return getFavorites().some(function(f){ return String(f.account_id)===String(accId); }); }
function toggleFavoriteFromBtn(btn){
  var info; try{ info=JSON.parse(btn.getAttribute('data-fav')); }catch(e){ return; }
  var arr=getFavorites();
  var idx=arr.findIndex(function(f){ return String(f.account_id)===String(info.account_id); });
  var wasFav=idx>=0;
  if(wasFav){ arr.splice(idx,1); } else { info.ts=Date.now(); arr.unshift(info); if(arr.length>50) arr=arr.slice(0,50); }
  saveFavorites(arr);
  var nowFav=!wasFav;
  btn.classList.toggle('chip-on', nowFav);
  btn.classList.toggle('chip', !nowFav);
  btn.textContent = nowFav ? '★ 已收藏' : '☆ 收藏';
}
function removeFavorite(accId){
  saveFavorites(getFavorites().filter(function(f){ return String(f.account_id)!==String(accId); }));
  var h=location.hash.replace(/^#/,'')||'/';
  if(!h.split('/').filter(Boolean).length) viewHome();
}

/* 骨架屏 */
function skLine(w){ return '<div class="sk h-4 '+(w||'w-full')+'"></div>'; }
function skRows(n){ var s=''; for(var i=0;i<(n||6);i++){ s+='<div class="flex items-center gap-3 py-2"><div class="sk h-8 w-14"></div>'+skLine('w-1/3')+skLine('w-16')+skLine('w-16')+'</div>'; } return s; }
function skCard(n){ return '<section class="card p-4 mb-4 sm:p-6 sm:mb-5">'+skLine('w-40')+'<div class="mt-3 space-y-2">'+skRows(n)+'</div></section>'; }

/* ============ 段位(去掉“星”:超凡2星 → 超凡2) ============ */
var MEDALS = ['','先锋','卫士','中军','统帅','传奇','万古','超凡','冠绝'];
var MEDAL_COLOR = {
  1:'text-zinc-600 dark:text-zinc-300 bg-zinc-500/10 ring-zinc-500/30',
  2:'text-emerald-600 dark:text-emerald-300 bg-emerald-500/10 ring-emerald-500/30',
  3:'text-teal-600 dark:text-teal-300 bg-teal-500/10 ring-teal-500/30',
  4:'text-sky-600 dark:text-sky-300 bg-sky-500/10 ring-sky-500/30',
  5:'text-indigo-600 dark:text-indigo-300 bg-indigo-500/10 ring-indigo-500/30',
  6:'text-fuchsia-600 dark:text-fuchsia-300 bg-fuchsia-500/10 ring-fuchsia-500/30',
  7:'text-cyan-600 dark:text-cyan-300 bg-cyan-500/10 ring-cyan-500/30',
  8:'text-amber-600 dark:text-amber-300 bg-amber-500/10 ring-amber-500/30'
};
function rankPoints(rt){ if(rt==null)return null; var m=Math.floor(rt/10),s=rt%10; if(m<1)return null; if(m>=8)return 36; return (m-1)*5+s; }
function rankFromPoints(p){ if(p==null)return '-'; if(p>=36)return '冠绝'; var medal=Math.floor((p-1)/5)+1,star=((p-1)%5)+1; if(medal<1||medal>7)return '-'; return MEDALS[medal]+star; }
function rankName(rt){ return rankFromPoints(rankPoints(rt)); }
function rankMmrRange(rt){ if(rt==null)return '-'; var m=Math.floor(rt/10),s=rt%10; if(m<1)return '-'; if(m>=8)return '约 5680+'; var low=(m-1)*770+(Math.max(1,s)-1)*154; return '约 '+low+'–'+(low+154); }
function rankBadge(rt){ if(rt==null) return '<span class="muted2">-</span>'; var m=Math.floor(rt/10); if(m<1) return '<span class="muted2">-</span>'; if(m>8)m=8; return '<span class="inline-flex items-center rounded-md px-2 py-0.5 text-xs font-medium ring-1 ring-inset '+(MEDAL_COLOR[m]||MEDAL_COLOR[1])+'">'+esc(rankName(rt))+'</span>'; }
function lobbyLabel(m){ if(m.lobby_type===7)return '排位'; if(m.game_mode===23)return '快速'; if(m.lobby_type===0)return '匹配'; return '其他'; }
function filterName(f){ return {all:'全部',ranked:'排位',normal:'匹配',turbo:'快速'}[f]||f; }

/* ============ 组件 ============ */
function card(inner,extra){ return '<section class="card fade p-4 mb-4 sm:p-6 sm:mb-5 '+(extra||'')+'">'+inner+'</section>'; }
function h3(t){ return '<h3 class="mb-3 text-sm font-semibold sm:text-base" style="color:var(--text)">'+esc(t)+'</h3>'; }
function pill(text,on,onclick){ return '<button type="button" class="rounded-md px-2.5 py-1.5 text-xs transition sm:px-3 sm:text-sm '+(on?'chip-on':'chip')+'" onclick="'+onclick+'">'+esc(text)+'</button>'; }
/* 桌面表格只在 ≥1200px 显示(表列多、最小宽度大);<1200px 一律走移动卡片,避免撑破/横向溢出 */
function tableOpen(cols){ return '<div class="hidden overflow-x-auto min-[1200px]:block"><table class="w-full text-sm sm:text-base"><thead><tr class="text-left text-xs thc">'+cols.map(function(c){return '<th class="px-3 py-2 font-medium whitespace-nowrap">'+esc(c)+'</th>';}).join('')+'</tr></thead><tbody>'; }
function tableClose(){ return '</tbody></table></div>'; }
/* 移动/中屏卡片列表容器(<1200px 显示,与桌面表格互斥) */
function mlistOpen(){ return '<div class="min-[1200px]:hidden">'; }
function mlistClose(){ return '</div>'; }
function mrow(inner,extra){ return '<div class="rowh flex items-center gap-3 px-1 py-3 '+(extra||'')+'">'+inner+'</div>'; }

/* ============ 路由 ============ */
function go(hash){ if(location.hash===hash){ route(); } else { location.hash=hash; } }
window.addEventListener('hashchange', route);
window.addEventListener('DOMContentLoaded', function(){ updateThemeBtn(); route(); });
function route(){
  var h=location.hash.replace(/^#/,'')||'/'; var parts=h.split('/').filter(Boolean);
  if(parts[0]==='player') return viewPlayer(parts[1]);
  if(parts[0]==='match')  return viewMatch(parts[1]);
  if(parts[0]==='search') return viewSearch(decodeURIComponent(parts.slice(1).join('/')));
  return viewHome();
}

/* ============ 统一搜索(自动判断:纯数字按 id/对局 走,其余按名字搜) ============ */
var _lastSearchAt=0;
function onSearch(e){
  e.preventDefault();
  var now=Date.now();
  if(now-_lastSearchAt<400) return;   // leading 节流:400ms 内的重复点击忽略(首次立即响应)
  _lastSearchAt=now;
  var v=document.getElementById('q').value.trim(); if(!v) return;
  var isNum=/^\d+$/.test(v);
  if(!isNum) return go('#/search/'+encodeURIComponent(v));
  if(v.length>=17 && v.indexOf('7656')===0) return go('#/player/'+v);
  return go(Number(v)>3000000000 ? '#/match/'+v : '#/player/'+v);
}

/* ============ 首页 ============ */
function viewHome(){
  app.innerHTML = card(
    '<div class="py-10 text-center">'
    + '<div class="text-2xl font-bold">查询 Dota 战绩</div>'
    + '<p class="mt-2 text-sm muted">搜索玩家昵称/ 玩家ID / SteamID64 / 对局ID</p>'
    + '<div class="mt-4 flex flex-wrap justify-center gap-2">'
    +   pill('示例玩家 4044783', false, "go('#/player/4044783')")
    +   pill('示例玩家 Observer', false, "go('#/search/Observer')")
    +   pill('示例对局 8897157671', false, "go('#/match/8897157671')")
    + '</div></div>') + renderFavCards();
  setStatus('');
}
function renderFavCards(){
  var favs=getFavorites();
  if(!favs.length) return '';
  var items=favs.map(function(f){
    var av=f.avatarfull?'<img src="'+esc(f.avatarfull)+'" class="h-10 w-10 shrink-0 rounded-full">':'<span class="h-10 w-10 shrink-0 rounded-full" style="background:var(--surface2)"></span>';
    return '<div class="card fade flex cursor-pointer items-center gap-3 p-3" onclick="go(\'#/player/'+f.account_id+'\')">'
      + av
      + '<div class="min-w-0 flex-1"><div class="truncate text-sm font-medium">'+esc(f.personaname||('account '+f.account_id))+'</div>'
      + '<div class="mt-1">'+rankBadge(f.rank_tier)+'</div></div>'
      + '<button type="button" class="chip shrink-0 rounded-md px-2 py-1 text-xs" title="取消收藏" onclick="event.stopPropagation();removeFavorite(\''+f.account_id+'\')">✕</button>'
      + '</div>';
  }).join('');
  return card(h3('★ 我的收藏('+favs.length+')')+'<div class="grid grid-cols-1 gap-2 sm:grid-cols-2 lg:grid-cols-3">'+items+'</div>');
}

/* ============ 搜索结果(按最近一把排序;段位不在此查,点进主页再看) ============ */
async function viewSearch(q){
  var url='/api/search?q='+encodeURIComponent(q);
  document.getElementById('q').value=q;
  if(!CACHE.has(url)) app.innerHTML = card(h3('搜索 “'+esc(q)+'”')+skRows(6));
  var d=await fetchJSON(url);
  if(d.error){ app.innerHTML=card(h3('搜索')+'<p class="text-sm text-rose-500">'+esc(d.error)+'</p>'); return; }
  var rows=d.results||[];
  if(!rows.length){ app.innerHTML=card(h3('搜索 “'+esc(q)+'”')+'<p class="text-sm muted">没搜到(OpenDota 搜索偶尔抽风,过会儿再试)。</p>'); return; }
  var body=tableOpen(['','昵称','account_id','最近一把','']);
  var mbody=mlistOpen();
  rows.forEach(function(p){
    var av=p.avatarfull?'<img src="'+p.avatarfull+'" class="h-9 w-9 shrink-0 rounded-full">':'<span class="h-9 w-9 shrink-0 rounded-full" style="background:var(--surface2)"></span>';
    var last=p.last_match_time?new Date(p.last_match_time).toLocaleDateString():'未知';
    body+='<tr class="rowh">'
      +'<td class="px-3 py-2.5">'+av+'</td>'
      +'<td class="px-3 py-2.5 font-medium">'+esc(p.personaname)+'</td>'
      +'<td class="px-3 py-2.5 muted">'+p.account_id+'</td>'
      +'<td class="px-3 py-2.5 muted">'+esc(last)+'</td>'
      +'<td class="px-3 py-2.5 text-right">'+pill('主页',false,"go('#/player/"+p.account_id+"')")+'</td></tr>';
    mbody+=mrow(av
      +'<div class="min-w-0 flex-1"><div class="truncate font-medium">'+esc(p.personaname)+'</div>'
      +'<div class="mt-1 flex flex-wrap items-center gap-x-2 gap-y-1 text-xs muted"><span>'+p.account_id+'</span><span class="muted2">·</span><span>'+esc(last)+'</span></div></div>'
      +pill('主页',false,"go('#/player/"+p.account_id+"')"));
  });
  body+=tableClose();
  mbody+=mlistClose();
  app.innerHTML=card(h3('找到 '+rows.length+' 个玩过 Dota 的玩家(按最近一把排序)')+body+mbody);
}

/* ============ 玩家页 ============ */
var CURRENT_ACC=null, HERO_FILTER='all', HERO_MINRANK='', PLAYER_MATCHES=[];
var CURRENT_HEROES=[], HERO_MIN_GAMES=20, HERO_COLLAPSED=false;
var RANK_OPTS=[['','无门槛'],['41','≥ 统帅1'],['51','≥ 传奇1'],['61','≥ 万古1'],['71','≥ 超凡1'],['80','≥ 冠绝']];
async function viewPlayer(id){
  CURRENT_ACC=id; HERO_FILTER='all'; HERO_MINRANK=''; PLAYER_MATCHES=[];
  CURRENT_HEROES=[]; HERO_MIN_GAMES=20; HERO_COLLAPSED=false;
  var url='/api/player?id='+encodeURIComponent(id);
  var hit=CACHE.has(url);
  app.innerHTML='<div id="pProfile">'+(hit?'':skCard(2))+'</div><div id="pHeroes"></div><div id="pMatches"></div>';
  var d=await fetchJSON(url);
  if(d.error){ document.getElementById('pProfile').innerHTML=card('<p class="text-sm text-rose-500">'+esc(d.error)+'</p>'); return; }
  renderProfile(d); renderHeroSection(d.heroes||[]); loadPlayerMatchesData(id);
}
function renderProfile(d){
  var p=d.profile||{};
  var av=p.avatarfull?'<img src="'+p.avatarfull+'" class="h-20 w-20 rounded-xl" style="outline:1px solid var(--border)">':'';
  var favInfo={account_id:d.account_id, personaname:p.personaname||('account '+d.account_id), avatarfull:p.avatarfull||'', rank_tier:(d.rank_tier==null?null:d.rank_tier)};
  var on=isFavorite(d.account_id);
  var favBtn='<button type="button" id="favBtn" data-fav="'+esc(JSON.stringify(favInfo))+'" onclick="toggleFavoriteFromBtn(this)" class="ml-auto shrink-0 rounded-lg px-3 py-2 text-sm '+(on?'chip-on':'chip')+'">'+(on?'★ 已收藏':'☆ 收藏')+'</button>';
  document.getElementById('pProfile').innerHTML=card(
    '<div class="flex flex-wrap items-center gap-4">'+av
    +'<div class="min-w-0 flex-1"><div class="truncate text-xl font-bold">'+esc(p.personaname||('account '+d.account_id))+'</div>'
    +'<div class="mt-1 flex flex-wrap items-center gap-2 text-sm muted">'+rankBadge(d.rank_tier)
    +'<span>MMR '+rankMmrRange(d.rank_tier)+'</span><span class="muted2">·</span><span>account_id '+d.account_id+'</span></div></div>'
    +favBtn+'</div>');
}
function loadHeroesFiltered(f){ HERO_FILTER=f; applyHeroFilters(); }
function onMinRankChange(sel){ HERO_MINRANK=sel.value; applyHeroFilters(); }
async function applyHeroFilters(){
  var url='/api/player_heroes?id='+encodeURIComponent(CURRENT_ACC)+'&filter='+HERO_FILTER+(HERO_MINRANK?('&min_rank='+HERO_MINRANK):'');
  var d=await fetchJSON(url);
  if(d.error){ document.getElementById('pHeroes').innerHTML=card('<p class="text-sm text-rose-500">'+esc(d.error)+'</p>'); return; }
  renderHeroSection(d.heroes||[]);
}
function renderHeroSection(heroes){
  CURRENT_HEROES=heroes||[];
  renderHeroList();
}
function onMinGamesInput(inp){
  var v=parseInt(inp.value,10);
  HERO_MIN_GAMES=(isNaN(v)||v<0)?0:v;
  renderHeroList();
}
function toggleHeroCollapse(){ HERO_COLLAPSED=!HERO_COLLAPSED; renderHeroList(); }
function renderHeroList(){
  var all=CURRENT_HEROES;
  var heroes=all.filter(function(x){ return (x.games||0) >= HERO_MIN_GAMES; });
  var btns=['all','ranked','normal','turbo'].map(function(f){ return pill(filterName(f), f===HERO_FILTER, "loadHeroesFiltered('"+f+"')"); }).join(' ');
  var opts=RANK_OPTS.map(function(o){ return '<option value="'+o[0]+'"'+(o[0]===HERO_MINRANK?' selected':'')+'>'+o[1]+'</option>'; }).join('');
  var sel='<select onchange="onMinRankChange(this)" class="sel rounded-md px-3 py-1.5 text-sm">'+opts+'</select>';
  var minGames='<label class="flex items-center gap-1.5 text-xs muted2">最少场次<input type="number" min="0" step="1" value="'+HERO_MIN_GAMES+'" oninput="onMinGamesInput(this)" class="sel w-16 rounded-md px-2 py-1 text-xs text-center sm:text-sm"></label>';
  var toggleBtn='<button type="button" onclick="toggleHeroCollapse()" class="chip ml-auto shrink-0 rounded-md px-2.5 py-1.5 text-xs sm:text-sm">'+(HERO_COLLAPSED?'展开 ▾':'收起 ▴')+'</button>';
  var controls='<div class="mb-3 flex flex-wrap items-center gap-2">'+btns+'<span class="ml-2 text-xs muted2">段位门槛</span>'+sel+minGames+toggleBtn+'</div>';
  var inner=h3('常玩英雄('+heroes.length+'/'+all.length+')')+controls;
  if(HERO_COLLAPSED){ document.getElementById('pHeroes').innerHTML=card(inner); return; }
  if(!heroes.length){ document.getElementById('pHeroes').innerHTML=card(inner+'<p class="text-sm muted">该口径下无数据(试试调低"最少场次")。</p>'); return; }
  var body=tableOpen(['英雄','场次','胜','胜率','']);
  var mbody=mlistOpen();
  heroes.forEach(function(x){
    var img=x.img?'<img src="'+x.img+'" class="mr-2 inline-block h-9 w-16 rounded object-cover align-middle">':'';
    var imgM=x.img?'<img src="'+x.img+'" class="h-9 w-16 shrink-0 rounded object-cover">':'<span class="h-9 w-16 shrink-0 rounded" style="background:var(--surface2)"></span>';
    var wrCls=x.winrate>=50?'text-emerald-600 dark:text-emerald-400':'text-rose-600 dark:text-rose-400';
    body+='<tr class="rowh"><td class="px-3 py-2">'+img+esc(x.name)+'</td>'
      +'<td class="px-3 py-2 muted">'+x.games+'</td><td class="px-3 py-2 muted">'+x.win+'</td>'
      +'<td class="px-3 py-2 font-medium '+wrCls+'">'+x.winrate+'%</td>'
      +'<td class="px-3 py-2 text-right">'+pill('最近战绩',false,"loadHeroMatches("+x.hero_id+",'"+esc(x.name).replace(/'/g,'')+"')")+'</td></tr>';
    mbody+=mrow(imgM
      +'<div class="min-w-0 flex-1"><div class="truncate font-medium">'+esc(x.name)+'</div>'
      +'<div class="mt-1 text-xs muted">场次 '+x.games+' · 胜 '+x.win+' · <span class="font-medium '+wrCls+'">'+x.winrate+'%</span></div></div>'
      +pill('最近战绩',false,"loadHeroMatches("+x.hero_id+",'"+esc(x.name).replace(/'/g,'')+"')"));
  });
  document.getElementById('pHeroes').innerHTML=card(inner+body+tableClose()+mbody+mlistClose());
}
async function loadPlayerMatchesData(acc){
  var url='/api/player_matches?id='+encodeURIComponent(acc);
  if(!CACHE.has(url)) document.getElementById('pMatches').innerHTML=skCard(6);
  var d=await fetchJSON(url);
  if(d.error){ document.getElementById('pMatches').innerHTML=card('<p class="text-sm text-rose-500">'+esc(d.error)+'</p>'); return; }
  PLAYER_MATCHES=d.matches||[]; renderPlayerMatches('all');
}
async function loadHeroMatches(heroId,label){
  var d=await fetchJSON('/api/player_matches?id='+encodeURIComponent(CURRENT_ACC)+'&hero_id='+heroId);
  if(d.error) return;
  document.getElementById('pMatches').innerHTML=card(h3(label+' 最近战绩('+(d.matches||[]).length+' 场)')+matchTable(d.matches||[]));
  window.scrollTo({top:document.getElementById('pMatches').offsetTop-70, behavior:'smooth'});
}
function renderPlayerMatches(f){
  var rows=PLAYER_MATCHES.filter(function(m){ if(f==='ranked')return m.lobby_type===7; if(f==='turbo')return m.game_mode===23; if(f==='normal')return m.lobby_type===0&&m.game_mode!==23; return true; });
  var btns=['all','ranked','normal','turbo'].map(function(x){ return pill(filterName(x), x===f, "renderPlayerMatches('"+x+"')"); }).join(' ');
  document.getElementById('pMatches').innerHTML=card(h3('全部战绩')+'<div class="mb-3 flex flex-wrap gap-2">'+btns+'</div>'+matchTable(rows));
}
function matchTable(rows){
  if(!rows.length) return '<p class="text-sm muted">无数据。</p>';
  var body=tableOpen(['英雄','类型','K/D/A','胜负','水平段','时间','']);
  var mbody=mlistOpen();
  rows.forEach(function(m){
    var hero=m._hero||{};
    var img=hero.img?'<img src="'+hero.img+'" class="mr-2 inline-block h-9 w-16 rounded object-cover align-middle">':'';
    var imgM=hero.img?'<img src="'+hero.img+'" class="h-9 w-16 shrink-0 rounded object-cover">':'<span class="h-9 w-16 shrink-0 rounded" style="background:var(--surface2)"></span>';
    var when=new Date(m.start_time*1000).toLocaleDateString();
    var wl=m._win?'<span class="text-emerald-600 dark:text-emerald-400">胜</span>':'<span class="text-rose-600 dark:text-rose-400">负</span>';
    body+='<tr class="rowh"><td class="px-3 py-2">'+img+esc(hero.name||('#'+m.hero_id))+'</td>'
      +'<td class="px-3 py-2 muted">'+lobbyLabel(m)+'</td><td class="px-3 py-2">'+m.kills+' / '+m.deaths+' / '+m.assists+'</td>'
      +'<td class="px-3 py-2">'+wl+'</td><td class="px-3 py-2">'+rankBadge(m.average_rank)+'</td>'
      +'<td class="px-3 py-2 muted2">'+esc(when)+'</td>'
      +'<td class="px-3 py-2 text-right">'+pill('详情',false,"go('#/match/"+m.match_id+"')")+'</td></tr>';
    mbody+=mrow(imgM
      +'<div class="min-w-0 flex-1"><div class="flex items-center gap-2"><span class="min-w-0 flex-1 truncate font-medium">'+esc(hero.name||('#'+m.hero_id))+'</span>'+wl+'</div>'
      +'<div class="mt-1 flex flex-wrap items-center gap-x-1.5 gap-y-1 text-xs muted"><span>'+lobbyLabel(m)+'</span><span class="muted2">·</span>'
      +'<span>'+m.kills+'/'+m.deaths+'/'+m.assists+'</span><span class="muted2">·</span>'+rankBadge(m.average_rank)
      +'<span class="muted2">·</span><span class="muted2">'+esc(when)+'</span></div></div>'
      +pill('详情',false,"go('#/match/"+m.match_id+"')"));
  });
  return body+tableClose()+mbody+mlistClose();
}

/* ============ 对局页 ============ */
async function viewMatch(mid){
  var url='/api/match?mode=od&id='+encodeURIComponent(mid);
  if(!CACHE.has(url)) app.innerHTML=skCard(3)+skCard(6);
  var d=await fetchJSON(url);
  if(d.error){ app.innerHTML=card('<p class="text-sm text-rose-500">'+esc(d.error)+'</p>'); return; }
  var res=d.result; if(!res){ app.innerHTML=card('<p class="text-sm muted">无数据。</p>'); return; }
  var players=res.players||[];
  var pts=players.map(function(p){return rankPoints(p.rank_tier);}).filter(function(x){return x!=null;});
  var avg=pts.length?Math.round(pts.reduce(function(a,b){return a+b;},0)/pts.length):null;
  var min=Math.floor(res.duration/60), sec=res.duration%60;
  var head='<div class="flex flex-wrap items-center gap-3">'
    +'<div class="text-lg font-bold">对局 '+res.match_id+'</div>'
    +'<span class="rounded-md px-2 py-0.5 text-xs" style="background:var(--surface2)">'+lobbyLabel(res)+'</span>'
    +'<span class="rounded-md px-2 py-0.5 text-xs ring-1 ring-inset '+(res.radiant_win?'text-emerald-600 dark:text-emerald-300 bg-emerald-500/10 ring-emerald-500/30':'text-rose-600 dark:text-rose-300 bg-rose-500/10 ring-rose-500/30')+'">'+(res.radiant_win?'天辉':'夜魇')+'胜</span>'
    +'<span class="text-sm muted">'+min+'分'+sec+'秒 · 比分 '+(res.radiant_score||0)+':'+(res.dire_score||0)+'</span>'
    +'<span class="text-sm muted">水平段 '+rankFromPoints(avg)+'</span>'+'</div>';
  app.innerHTML=card(head)
    +teamCard('天辉 Radiant', res.radiant_win, players.filter(function(p){return p._side===0;}))
    +teamCard('夜魇 Dire', !res.radiant_win, players.filter(function(p){return p._side===1;}));
}
function teamCard(title,win,players){
  var badge=win?'<span class="ml-2 rounded px-2 py-0.5 text-xs text-emerald-600 dark:text-emerald-300 bg-emerald-500/10 ring-1 ring-inset ring-emerald-500/30">胜</span>'
               :'<span class="ml-2 rounded px-2 py-0.5 text-xs text-rose-600 dark:text-rose-300 bg-rose-500/10 ring-1 ring-inset ring-rose-500/30">负</span>';
  var inner='<h3 class="mb-3 text-sm font-semibold" style="color:var(--text)">'+esc(title)+badge+'</h3>';
  var body=tableOpen(['玩家','英雄','段位','K/D/A','净资产','GPM/XPM','正/反','装备']);
  var mbody=mlistOpen();
  players.forEach(function(p){
    var hero=p._hero||{};
    var heroImg=hero.img?'<img src="'+hero.img+'" class="h-9 w-16 rounded object-cover align-middle" title="'+esc(hero.name)+'">':'';
    var heroImgM=hero.img?'<img src="'+hero.img+'" class="h-6 w-11 shrink-0 rounded object-cover">':'';
    var av=p._anon?'<span class="h-8 w-8 shrink-0 rounded-full" style="background:var(--surface2)"></span>':(p._avatar?'<img src="'+p._avatar+'" class="h-8 w-8 shrink-0 rounded-full align-middle">':'<span class="h-8 w-8 shrink-0 rounded-full" style="background:var(--surface2)"></span>');
    var pname=p._anon?'<span class="muted2">匿名</span>':'<button class="link" onclick="go(\'#/player/'+p.account_id+'\')">'+esc(p._persona||('#'+p.account_id))+'</button>';
    body+='<tr class="rowh align-middle">'
      +'<td class="px-3 py-2.5"><div class="flex w-40 items-center gap-2">'+av+'<div class="min-w-0 flex-1 truncate">'+pname+'</div></div></td>'
      +'<td class="px-3 py-2.5"><div class="flex items-center gap-2">'+heroImg+'<span>'+esc(hero.name||('#'+p.hero_id))+'</span></div></td>'
      +'<td class="px-3 py-2.5">'+rankBadge(p.rank_tier)+'</td>'
      +'<td class="px-3 py-2.5">'+p.kills+' / '+p.deaths+' / '+p.assists+'</td>'
      +'<td class="px-3 py-2.5 text-amber-600 dark:text-amber-300">'+(p.net_worth==null?'-':p.net_worth)+'</td>'
      +'<td class="px-3 py-2.5 muted">'+p.gold_per_min+' / '+p.xp_per_min+'</td>'
      +'<td class="px-3 py-2.5 muted">'+p.last_hits+' / '+p.denies+'</td>'
      +'<td class="px-3 py-2.5">'+itemsHtml(p)+'</td></tr>';
    mbody+='<div class="rowh px-1 py-3">'
      +'<div class="flex items-center gap-3">'+av
      +'<div class="min-w-0 flex-1"><div class="flex items-center gap-2"><span class="min-w-0 flex-1 truncate text-sm font-medium">'+pname+'</span>'+rankBadge(p.rank_tier)+'</div>'
      +'<div class="mt-1 flex items-center gap-1.5 text-xs muted">'+heroImgM+'<span class="min-w-0 flex-1 truncate">'+esc(hero.name||('#'+p.hero_id))+'</span></div></div></div>'
      +'<div class="mt-2 grid grid-cols-3 gap-2 text-xs muted">'
      +'<div>KDA <span class="font-medium" style="color:var(--text)">'+p.kills+'/'+p.deaths+'/'+p.assists+'</span></div>'
      +'<div>净资产 <span class="font-medium text-amber-600 dark:text-amber-300">'+(p.net_worth==null?'-':p.net_worth)+'</span></div>'
      +'<div>GPM/XPM <span class="font-medium" style="color:var(--text)">'+p.gold_per_min+'/'+p.xp_per_min+'</span></div></div>'
      +'<div class="mt-2">'+itemsHtml(p)+'</div></div>';
  });
  return card(inner+body+tableClose()+mbody+mlistClose());
}
function itemsHtml(p){
  var out='<div class="flex flex-wrap items-center gap-0.5">';
  (p._items||[]).forEach(function(it){ out += it.img?'<img src="'+it.img+'" class="h-7 w-9 rounded-sm" title="'+esc(it.name)+'">':'<span class="text-xs muted2">'+esc(it.name)+'</span>'; });
  if(p._neutral && p._neutral.img) out+='<img src="'+p._neutral.img+'" class="ml-1 h-7 w-7 rounded-full" title="中立:'+esc(p._neutral.name)+'">';
  return out+'</div>';
}
</script>
</body>
</html>
